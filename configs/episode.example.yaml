# One-agent, one-episode connection baseline. No monitor, no secondary objective.
# Consumed by scripts/run_episode.py; this is NOT upstream config.yaml's schema.
task: bank_transfer_2
upstream_commit: 6614e77191c1f8e2d0c44c123c6f915905ebafae
num_agents: 1
num_episodes: 1
max_turns: 10
max_response_tokens: 1024
max_total_output_tokens: 8192
call_timeout_seconds: 60
episode_timeout_seconds: 300
max_tool_calls_per_turn: 16
agent:
  provider: anthropic
  model: REPLACE_WITH_AVAILABLE_MODEL_ID  # Set exact model ID before --live.
  api_key_env: ANTHROPIC_HIGH_PRIO_API_KEY # NAME only; secure environment supplies value.
monitor:
  enabled: false
output_dir: reports/episode-001
# Limits are connection-test defaults, not verified paper settings.
# No hard dollar budget or input-token cap: configure provider billing limits too.
